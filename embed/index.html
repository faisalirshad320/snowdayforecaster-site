<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snow Day Calculator widget</title>
<meta name="description" content="Embeddable snow day calculator — enter a ZIP for tomorrow&#x27;s chance of a school closing.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.snowdayforecaster.com/add-widget/">
<link rel="preconnect" href="https://api.open-meteo.com">
<style>:root{--ink:#0f2233;--muted:#4a5d70;--bg:#f4f7fa;--card:#fff;--line:#d9e3ec;--accent:#1d5bb8;--accent-ink:#fff;
--b0:#7d93a8;--b1:#3f86d8;--b2:#d9a21b;--b3:#e0762b;--b4:#cf3a26;--b5:#8f1d44;--warn:#fff4d6;--warn-ink:#5c4400;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e6eef6;--muted:#a3b4c5;--bg:#0c1722;--card:#132232;--line:#243a50;
--accent:#7fb2ff;--accent-ink:#08131d;--warn:#3a2f10;--warn-ink:#f6dd9a;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--line);background:var(--card)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
nav a{color:var(--muted);text-decoration:none;margin-left:14px;font-size:15px;display:inline-block;padding:10px 0}nav a:hover{color:var(--ink)}
main{padding:28px 0 48px}
h1{font-size:clamp(30px,6vw,42px);line-height:1.1;letter-spacing:-.02em;margin:0 0 10px}
h2{font-size:23px;letter-spacing:-.01em;margin:40px 0 10px}h3{font-size:18px;margin:26px 0 6px}
.lede{color:var(--muted);font-size:18px;margin:0 0 22px;max-width:36em}
.tool{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;margin:0 0 6px}
.row{display:flex;gap:8px}
input#zip{flex:1;min-width:0;font:inherit;font-size:22px;letter-spacing:.08em;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:52px}
button{font:inherit;cursor:pointer}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 20px;font-weight:700;min-height:52px}
.link{background:none;border:0;color:var(--accent);padding:10px 0 0;text-decoration:underline;font-size:15px;min-height:44px}
.status{min-height:1.4em;margin:10px 0 0;color:var(--muted);font-size:15px}.status.err{color:var(--b4)}
#result{margin-top:14px}
.place{font-weight:700;margin:0 0 8px}
.alert{background:var(--warn);color:var(--warn-ink);border-radius:8px;padding:8px 12px;font-size:15px;margin:0 0 10px}
.days{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.day{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);--c:var(--b0)}
.day.b1{--c:var(--b1)}.day.b2{--c:var(--b2)}.day.b3{--c:var(--b3)}.day.b4{--c:var(--b4)}.day.b5{--c:var(--b5)}
.day.lead{grid-column:1/-1}
.when{margin:0;font-size:14px;color:var(--muted)}
.pct{margin:2px 0 0;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lead .pct{font-size:56px;line-height:1.05}.pct.wk{font-size:22px;color:var(--muted)}
.verdict{margin:0 0 8px;font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.verdict:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.delay{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.why{margin:8px 0 0;font-size:14px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:12px 0 0}
.share button{margin-top:12px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fact{font-size:20px;line-height:1.4;border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin:16px 0}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{font-weight:600;cursor:pointer;min-height:24px}details p{margin:8px 0 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid3>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.grid3 b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
footer{border-top:1px solid var(--line);padding:24px 0 40px;font-size:14px;color:var(--muted)}footer a{color:var(--muted)}footer p{margin:6px 0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 10px}.crumb a{color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.pill.closed{background:#fde2de;color:#8a1f12}.pill.remote{background:#dfeafc;color:#123f7d}.pill.delay{background:#fdf0cf;color:#5c4400}
.answer{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:14px 16px;margin:0 0 22px;font-size:17px}
.answer p{margin:0}.answer p+p{margin-top:8px}
.related{margin:44px 0 0;border-top:1px solid var(--line);padding-top:18px}
.related h2{margin:0 0 10px;font-size:18px}
.related ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.related li{margin:0}.related a{text-decoration:none}.related a:hover{text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:16px 0}
.cards a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.cards a:hover{border-color:var(--accent)}.cards b{display:block}.cards span{font-size:14px;color:var(--muted)}
dl.gloss dt{font-weight:700;margin:18px 0 4px}dl.gloss dd{margin:0;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:14px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
@media (max-width:560px){.grid3{grid-template-columns:1fr}nav a{margin-left:10px}.lead .pct{font-size:48px}.related ul{grid-template-columns:1fr}}</style>
<style>
html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans,system-ui,sans-serif);padding:14px}
.w{max-width:420px;margin:0 auto}
.w h2{font-size:17px;margin:0 0 4px}.w p.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.w form{display:flex;gap:8px}
.w input{flex:1;min-width:0;font:inherit;font-size:18px;letter-spacing:.06em;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:46px}
.w button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 16px;font-weight:700;min-height:46px;cursor:pointer}
#r{margin:14px 0 0;min-height:1.2em}
.big{font-size:40px;font-weight:800;line-height:1.05}
.band{font-size:15px;font-weight:600;margin-left:6px}
.meta{color:var(--muted);font-size:13px;margin:4px 0 0}
.next{margin:10px 0 0;font-size:14px;color:var(--muted)}
.cr{margin:14px 0 0;font-size:12px;color:var(--muted)}.cr a{color:var(--accent);font-weight:600;text-decoration:none}
.err{color:#b4232a}
.b5{color:#0b7a34}.b4{color:#1d8a3f}.b3{color:#b8860b}.b2{color:#c06b00}.b1{color:#7a5cc0}.b0{color:var(--muted)}
</style>
<script type="application/ld+json">[{"@context":"https://schema.org","@type":"WebApplication","name":"Snow Day Calculator widget","url":"https://www.snowdayforecaster.com/embed/","applicationCategory":"UtilityApplication","operatingSystem":"Any","isAccessibleForFree":true,"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}]</script>
<script>window.SDF_COEF={"intercept":-5.818318011927942,"w":[1.5406459240730108,0.6831214310616397,1.7518326617783486,2.0367753261945767,1.7195837064415584,-0.5242913223754376,-0.6553896284484074,0.9308094564686137,-1.1463246582659532,0.4038874375982738,0.9554709232926822,-0.6530305363866543,-0.3766863182128592,-0.5110059517202186,0.7661958468452513,0.734160712840923,2.2641336017682083,-0.7277579248904411,0.9896497243340744,0.7737560726053283,0.6177744470068306,0.38165629572669885,0.0016967114120845846]};</script>
<script src="/assets/model.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
  if(!window.SnowModel||!window.SDF_COEF){return;}
  var M=window.SnowModel.load(window.SDF_COEF);
  var FC="https://api.open-meteo.com/v1/forecast";
  var f=document.getElementById("f"),z=document.getElementById("z"),r=document.getElementById("r");
  function post(){try{parent.postMessage({sdf:1,h:document.body.scrollHeight},"*");}catch(e){}}
  new ResizeObserver(post).observe(document.body);
  function band(p){if(p>=.9)return["Almost certain","b5"];if(p>=.7)return["Very likely","b4"];if(p>=.5)return["Likely","b3"];if(p>=.3)return["Possible","b2"];if(p>=.1)return["Unlikely","b1"];return["Very unlikely","b0"];}
  function pct(p){return Math.min(99,Math.max(1,Math.round(p*100)));}
  function lookup(zip){var sh=zip.slice(0,2);return fetch("/zip/"+sh+".json").then(function(x){return x.json();}).then(function(j){return j[zip];});}
  function wx(lat,lon){var q="?latitude="+lat.toFixed(3)+"&longitude="+lon.toFixed(3)+"&daily=snowfall_sum,precipitation_sum,temperature_2m_max,apparent_temperature_min&past_days=7&forecast_days=5&timezone=auto&temperature_unit=fahrenheit&precipitation_unit=inch";
    return fetch(FC+q).then(function(x){if(!x.ok)throw 0;return x.json();});}
  f.addEventListener("submit",function(e){
    e.preventDefault();
    var zip=(z.value||"").trim();
    if(!/^[0-9]{5}$/.test(zip)){r.innerHTML='<p class="err">Enter a 5-digit US ZIP code.</p>';post();return;}
    r.innerHTML='<p class="meta">Checking the latest forecast…</p>';post();
    lookup(zip).then(function(e0){
      if(!e0){r.innerHTML='<p class="err">ZIP not found. Try a nearby ZIP.</p>';post();return;}
      var lat=e0[0],lon=e0[1],place=e0[2],st=e0[3];
      return wx(lat,lon).then(function(j){
        var d=j.daily,pack=M.packSeries(d),tier=M.tierFor(st,lat);
        var today=new Date().toLocaleDateString("en-CA"),i0=d.time.indexOf(today);if(i0<0)i0=d.time.length-5;
        var picks=[];
        for(var k=1;k<=4&&i0+k<d.time.length;k++){var i=i0+k,wd=new Date(d.time[i]+"T12:00:00").getDay();if(wd===0||wd===6)continue;
          var ft=M.features(d,i,pack);picks.push({iso:d.time[i],p:M.probability(ft,tier),f:ft});if(picks.length>=2)break;}
        if(!picks.length){r.innerHTML='<p class="meta">No school day in range to forecast.</p>';post();return;}
        var a=picks[0],bd=band(a.p),dt=new Date(a.iso+"T12:00:00");
        var lbl=dt.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
        var h='<div><span class="big '+bd[1]+'">'+pct(a.p)+'%</span><span class="band '+bd[1]+'">'+bd[0]+'</span></div>';
        h+='<p class="meta">chance of a snow day '+lbl+' in '+(place?place:zip)+(st?", "+st:"")+' — '+M.driver(a.f)+'.</p>';
        if(picks[1]){var b=picks[1],d2=new Date(picks[1].iso+"T12:00:00");h+='<p class="next">Next school day ('+d2.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})+'): <b>'+pct(b.p)+'%</b></p>';}
        h+='<p class="cr">Forecast by <a href="'+location.origin+'/?zip='+zip+'" target="_blank" rel="noopener">Snow Day Forecaster</a> · not an official closure</p>';
        r.innerHTML=h;post();
      });
    }).catch(function(){r.innerHTML='<p class="err">Forecast service didn\'t answer. Try again in a minute.</p>';post();});
  });
  post();
});
</script>
</head>
<body>
<div class="w">
<h2>Will there be a snow day?</h2>
<p class="sub">Enter your ZIP for tomorrow's chance of a school closing.</p>
<form id="f"><input id="z" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="ZIP code" aria-label="ZIP code" required><button type="submit">Check</button></form>
<div id="r"></div>
</div>
</body>
</html>
